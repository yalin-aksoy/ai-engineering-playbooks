name: Validate playbooks

on:
  pull_request:
    paths:
      - "playbooks/**/*.md"
      - "scripts/validate_playbooks.py"
      - ".github/workflows/validate-playbooks.yml"
  push:
    paths:
      - "playbooks/**/*.md"
      - "scripts/validate_playbooks.py"
      - ".github/workflows/validate-playbooks.yml"

permissions:
  contents: read

jobs:
  required-sections:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate playbook sections
        run: python scripts/validate_playbooks.py
